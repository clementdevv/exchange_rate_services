name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop


jobs:
  docker-build:
    #    if: >
    #      ${{ github.event.workflow_run.conclusion == 'success' &&
    #          github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Java 21 (Amazon Corretto)
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Load environment file based on branch
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run build script
        run: ./build.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./rate-service
          file: ./rate-service/Dockerfile
          push: true
          tags: |
            clementdevv/exchange-rate-services:${{ github.sha }}
            clementdevv/exchange-rate-services:latest